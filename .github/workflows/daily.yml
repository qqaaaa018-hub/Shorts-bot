name: shorts-bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "quiz, oddone or illusion"
        required: false
        default: "quiz"
      language:
        description: "Language: en"
        required: false
        default: "en"
      dry_run:
        description: "0 = upload to YouTube, 1 = build only (test)"
        required: false
        default: "0"
  schedule:
    - cron: "0 5 * * *"    # 09:00 Dubai  -> missing-letters quiz
    - cron: "0 11 * * *"   # 15:00 Dubai  -> find the odd one out
    - cron: "0 17 * * *"   # 21:00 Dubai  -> optical illusion

permissions:
  contents: write

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python packages
        run: pip install -U requests edge-tts

      - name: Build and upload episode
        env:
          # one language for the whole channel (change the default above or set a repo variable)
          VIDEO_LANG: ${{ github.event.inputs.language || 'en' }}
          VIDEO_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 11 * * *' && 'oddone') || (github.event.schedule == '0 17 * * *' && 'illusion') || 'quiz' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          YT_REFRESH: ${{ secrets.YT_REFRESH }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          for i in 1 2; do
            python main.py && exit 0
            rc=$?
            # 3 = YouTube login broken: retrying will not help
            if [ $rc -eq 3 ]; then exit $rc; fi
            echo "attempt $i failed, waiting 2 min"; sleep 120
          done
          exit 1

      - name: Keep the video file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/video.mp4
            output/meta.json
          if-no-files-found: ignore

      - name: Save story progress
        if: success()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          if [ -f story.json ]; then git add story.json; fi
          git diff --cached --quiet || (git commit -m "save episode" && git push)
