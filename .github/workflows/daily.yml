name: shorts-bot

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (empty = Gemini picks)"
        required: false
        default: ""
      dry_run:
        description: "0 = upload to YouTube, 1 = build only (test)"
        required: false
        default: "0"
  schedule:
    - cron: "0 5 * * *"    # 09:00 Dubai
    - cron: "0 11 * * *"   # 15:00 Dubai
    - cron: "0 17 * * *"   # 21:00 Dubai

permissions:
  contents: write

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install requests edge-tts

      - name: Build and upload episode
        env:
          TTS_VOICE: "en-US-ChristopherNeural"
          TTS_PITCH: "-4Hz"
          TTS_RATE: "+0%"
          TOPIC: ${{ github.event.inputs.topic }}
          # manual runs follow the dry_run input (default 1); scheduled runs upload
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          YT_REFRESH: ${{ secrets.YT_REFRESH }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          for i in 1 2 3; do
            python main.py && exit 0
            echo "attempt $i failed, waiting 3 min"; sleep 180
          done
          exit 1

      - name: Keep the video file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/video.mp4
            output/meta.json
          if-no-files-found: ignore

      - name: Save story progress
        if: success()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          if [ -f story.json ]; then git add story.json; fi
          git diff --cached --quiet || (git commit -m "save episode" && git push)
